# Konfigurasi gitleaks (FINAL §3, revisi adversarial) — TANPA kelas 0x-64hex / base58 luas.
# Kelas-kelas itu terbukti membutakan deteksi kunci privat (uji adversarial 2026-10-25):
#   - base58 {32,44} menutup substring 0x-64hex (RE2 tanpa lookahead)
#   - 0x-64hex menutup kunci privat berprefiks 0x
# FP terverifikasi ditangani .gitleaksignore (fingerprint per file:line:rule) — auditabel.
[extend]
useDefault = true

[allowlist]
description = "konstanta topik publik EKSAK (5 nilai) + sampel docs/onchain"
regexes = [
  '''0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef''',
  '''0xc42079f94a6350d7e6235f29174924f928cc2ac818eb64fed8004e115fbcca67''',
  '''0x4c209b5fc8ad50758f13e2e1088ba56a560dff690a1c6fef26394f4c03821c4f''',
  '''0x0c396cd989a39f4459b5fa1aed6a9a8dcdbc45908acfd67e028cd568da98982c''',
  '''0x7a53080ba414158be7ec69b987b5fb7d07dee101fe85488f0853ae16239d0bde''',
]
paths = [
  '''^docs/onchain/''',
  '''^archive/paper-legacy/.*\.jsonl$''',
  '''^archive/paper-legacy/rh-paper-state\.json$''',
  '''^archive/paper-legacy/rh-limit-pending\.json$''',
  '''^web/scripts/fixtures/''',
]

[[rules]]
id = "evm-private-key-0x-prefixed"
description = "EVM private key candidate (0x + 64 hex, konteks kunci)"
regex = '''0x[0-9a-fA-F]{64}'''
entropy = 3.0
keywords = ["key", "private", "secret", "wallet", "signer", "pk"]

[[rules]]
id = "evm-private-key-no-prefix"
description = "EVM private key candidate (64 hex tanpa prefiks, konteks kunci)"
regex = '''\b[0-9a-fA-F]{64}\b'''
entropy = 3.0
keywords = ["key", "private", "secret", "wallet", "signer", "pk"]
