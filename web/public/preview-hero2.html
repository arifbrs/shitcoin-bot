const R=(c,n)=>{const x=document.createElement("div");x.className="col";

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const SPAN=L[L.length-1].x;                    // detik yang tercakup data
const BAND=[55,100];                           // band entry kita
const inBand=v=>v>=BAND[0]&&v<=BAND[1];
const yMC=(v,H)=>{const lo=Math.log(27),hi=Math.log(430);
  return H-((Math.log(Math.max(v,27))-lo)/(hi-lo))*H};

/* ═══════════════ A — HUJAN PELUNCURAN ═══════════════
   Sumbu tegak = MC peluncuran (log 27→430 ◎), mendatar = waktu.
   Hampir semua koin lahir di 27,96 — konstanta kurva pump.fun — jadi
   lantai itu tergambar sendiri sebagai garis padat. Yang menyembul ke
   atas adalah dev yang benar-benar menaruh modal. Pita entry 55–100
   disorot, dan Anda melihat betapa jarangnya sesuatu lahir di sana. */
function rain(){
  const el=$(`<div class="tile">
    <div class="hdr"><span class="dot"></span>PASAR · HUJAN PELUNCURAN</div>
    <canvas></canvas>
    <div class="foot">
      <div class="stat"><div class="v" style="color:var(--acid)">${L.length}</div><div class="k">peluncuran</div></div>
      <div class="stat"><div class="v">${(L.length/(SPAN/60)).toFixed(0)}<span style="font-size:11px;color:var(--dimmer)">/mnt</span></div><div class="k">laju</div></div>
      <div class="stat"><div class="v" style="color:var(--gold)">${L.filter(o=>inBand(o.mc)).length}</div><div class="k">lahir di band</div></div>
      <div style="flex:1"></div>
      <div class="num" style="font-size:9.5px;color:var(--dimmer)">${(SPAN/60).toFixed(0)} menit terakhir</div>
    </div></div>`);
  requestAnimationFrame(()=>{
    const cv=el.querySelector("canvas"), ctx=cv.getContext("2d"), DPR=devicePixelRatio||1;
    const r=cv.getBoundingClientRect(); cv.width=r.width*DPR; cv.height=r.height*DPR; ctx.scale(DPR,DPR);
    const W=r.width, H=r.height, PT=52, PB=62;
    const drops=L.map(o=>({...o, born:-Math.random()*1.2}));
    let t0=performance.now();
    function frame(now){
      const el2=(now-t0)/1000;
      ctx.clearRect(0,0,W,H);
      // pita entry
      const yb1=PT+yMC(BAND[1],H-PT-PB), yb2=PT+yMC(BAND[0],H-PT-PB);
      const g=ctx.createLinearGradient(0,yb1,0,yb2);
      g.addColorStop(0,"rgba(232,197,106,.12)"); g.addColorStop(1,"rgba(232,197,106,.03)");
      ctx.fillStyle=g; ctx.fillRect(0,yb1,W,yb2-yb1);
      ctx.strokeStyle="rgba(232,197,106,.35)"; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(0,yb1); ctx.lineTo(W,yb1); ctx.moveTo(0,yb2); ctx.lineTo(W,yb2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="rgba(232,197,106,.75)"; ctx.font="9px ui-monospace,monospace";
      ctx.fillText("band entry 55–100 ◎",8,yb1-5);
      // lantai 27,96
      const yf=PT+yMC(28,H-PT-PB);
      ctx.strokeStyle="rgba(124,130,141,.30)"; ctx.beginPath(); ctx.moveTo(0,yf); ctx.lineTo(W,yf); ctx.stroke();
      ctx.fillStyle="rgba(124,130,141,.7)"; ctx.fillText("27,96 ◎ — semua koin lahir di sini",8,yf+13);
      // tetesan
      const prog=reduce?1:Math.min(1,el2/6);
      drops.forEach(d=>{
        const a=(d.x/SPAN)-(1-prog); if(a<-0.02) return;
        const x=(d.x/SPAN)*W, y=PT+yMC(d.mc,H-PT-PB);
        const band=inBand(d.mc), big=d.mc>120;
        const rr=band?3.1:(big?2.2:1.15);
        ctx.globalAlpha=band?.95:(big?.6:.30);
        ctx.fillStyle=band?css("--gold"):(big?css("--acid"):"#7f8a96");
        ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill();
        if(band){ctx.globalAlpha=.20;ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();}
      });
      ctx.globalAlpha=1;
      if(!reduce&&el2<7) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  return el;
}

/* ═══════════════ B — RADAR SAPU ═══════════════
   Sudut = waktu (satu putaran = rentang data), jari-jari = MC.
   Pita entry jadi cincin. Garis sapu berputar dan menyalakan kembali
   blip yang dilewatinya, jadi denyut pasar terbaca sebagai ritme. */
function radar(){
  const el=$(`<div class="tile">
    <div class="hdr"><span class="dot"></span>PASAR · SAPUAN</div>
    <canvas></canvas>
    <div class="foot">
      <div class="stat"><div class="v" style="color:var(--acid)">${X.totals.gated}</div><div class="k">dinilai</div></div>
      <div class="stat"><div class="v" style="color:var(--up)">${X.totals.passed}</div><div class="k">masuk</div></div>
      <div class="stat"><div class="v" style="color:var(--down)">${X.totals.rejected}</div><div class="k">ditolak</div></div>
      <div style="flex:1"></div>
      <div class="num" style="font-size:9.5px;color:var(--dimmer)">${X.seen.toLocaleString("id")} dilihat scout</div>
    </div></div>`);
  requestAnimationFrame(()=>{
    const cv=el.querySelector("canvas"), ctx=cv.getContext("2d"), DPR=devicePixelRatio||1;
    const r=cv.getBoundingClientRect(); cv.width=r.width*DPR; cv.height=r.height*DPR; ctx.scale(DPR,DPR);
    const W=r.width,H=r.height,cx=W/2,cy=H/2+6,RAD=Math.min(W,H)/2-46;
    const pts=L.map(o=>({ang:(o.x/SPAN)*Math.PI*2-Math.PI/2, rr:(1-yMC(o.mc,1))*RAD, band:inBand(o.mc), mc:o.mc}));
    let t0=performance.now();
    function frame(now){
      const sweep=((now-t0)/4200)%1*Math.PI*2-Math.PI/2;
      ctx.clearRect(0,0,W,H);
      // cincin
      ctx.strokeStyle="rgba(26,29,36,1)"; ctx.lineWidth=1;
      [0.33,0.66,1].forEach(k=>{ctx.beginPath();ctx.arc(cx,cy,RAD*k,0,7);ctx.stroke();});
      // cincin band
      const r1=(1-yMC(BAND[0],1))*RAD, r2=(1-yMC(BAND[1],1))*RAD;
      ctx.fillStyle="rgba(232,197,106,.07)";
      ctx.beginPath();ctx.arc(cx,cy,r2,0,7);ctx.arc(cx,cy,r1,0,7,true);ctx.fill();
      ctx.strokeStyle="rgba(232,197,106,.30)";ctx.setLineDash([3,3]);
      [r1,r2].forEach(rr=>{ctx.beginPath();ctx.arc(cx,cy,rr,0,7);ctx.stroke();});ctx.setLineDash([]);
      // blip
      pts.forEach(p=>{
        let d=sweep-p.ang; while(d<0)d+=Math.PI*2; while(d>Math.PI*2)d-=Math.PI*2;
        const fresh=Math.max(0,1-d/(Math.PI*1.5));
        const x=cx+Math.cos(p.ang)*p.rr, y=cy+Math.sin(p.ang)*p.rr;
        ctx.globalAlpha=(p.band?.35:.12)+fresh*(p.band?.65:.45);
        ctx.fillStyle=p.band?css("--gold"):(p.mc>120?css("--acid"):"#7f8a96");
        ctx.beginPath();ctx.arc(x,y,p.band?3:1.3,0,7);ctx.fill();
      });
      ctx.globalAlpha=1;
      // garis sapu
      const gg=ctx.createLinearGradient(cx,cy,cx+Math.cos(sweep)*RAD,cy+Math.sin(sweep)*RAD);
      gg.addColorStop(0,"rgba(201,240,74,0)");gg.addColorStop(1,"rgba(201,240,74,.55)");
      ctx.strokeStyle=gg;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(sweep)*RAD,cy+Math.sin(sweep)*RAD);ctx.stroke();
      ctx.fillStyle="rgba(124,130,141,.6)";ctx.font="8.5px ui-monospace,monospace";
      ctx.fillText("cincin = band entry 55–100 ◎",12,H-72);
      if(!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  return el;
}

/* ═══════════════ C — ARUS GERBANG ═══════════════
   Partikel mengalir kiri→kanan melewati gerbang. Yang ditolak
   mengelupas ke bawah pada alasannya masing-masing, jadi terlihat
   gerbang mana yang paling banyak menyaring. Hanya cacah, tanpa uang. */
function gates(){
  const rej=Object.entries(X.rej).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const nm={deadToken:"token mati",staleMc:"MC basi",bundle:"bundle",ath:"dekat ATH",unroutable:"tak dirutekan",cost:"biaya"};
  const el=$(`<div class="tile">
    <div class="hdr"><span class="dot"></span>SCANNER · ARUS GERBANG</div>
    <canvas></canvas>
    <div style="position:absolute;left:17px;top:44px;z-index:2">
      <div class="num" style="font-size:34px;line-height:1;color:var(--up)">${X.totals.passed}</div>
      <div style="font-size:10px;color:var(--dim);margin-top:2px">masuk posisi</div>
    </div>
    <div style="position:absolute;right:17px;top:46px;z-index:2;text-align:right">
      ${rej.map(([k,v])=>`<div style="display:flex;align-items:center;gap:7px;justify-content:flex-end;margin-bottom:4px">
        <span style="font-size:9.5px;color:var(--dimmer)">${nm[k]||k}</span>
        <span class="num" style="font-size:11px;color:var(--down);width:24px;text-align:right">${v}</span></div>`).join("")}
    </div>
    <div class="foot">
      <div class="stat"><div class="v">${X.seen.toLocaleString("id")}</div><div class="k">dilihat</div></div>
      <div class="stat"><div class="v">${X.totals.gated}</div><div class="k">dinilai</div></div>
      <div class="stat"><div class="v" style="color:var(--up)">${Math.round(X.totals.passRate*100)}%</div><div class="k">lolos</div></div>
      <div style="flex:1"></div>
      <div class="num" style="font-size:9px;color:var(--dimmer);max-width:250px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">
        ${X.scan.slice(0,9).map(s=>s.s).join(" · ")}</div>
    </div></div>`);
  requestAnimationFrame(()=>{
    const cv=el.querySelector("canvas"), ctx=cv.getContext("2d"), DPR=devicePixelRatio||1;
    const r=cv.getBoundingClientRect(); cv.width=r.width*DPR; cv.height=r.height*DPR; ctx.scale(DPR,DPR);
    const W=r.width,H=r.height, LANE=H*0.52, N=150;
    const passRate=X.totals.passRate;
    const lanes=rej.map((_,i)=>LANE+40+i*22);
    const ps=Array.from({length:N},()=>({x:Math.random()*W,y:LANE+(Math.random()-.5)*26,
      pass:Math.random()<passRate, lane:Math.floor(Math.random()*rej.length), v:.5+Math.random()*1.1}));
    const GATE=W*0.42;
    function frame(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle="rgba(26,29,36,1)";ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(GATE,LANE-40);ctx.lineTo(GATE,H-58);ctx.stroke();
      ctx.fillStyle="rgba(124,130,141,.55)";ctx.font="8.5px ui-monospace,monospace";
      ctx.fillText("gerbang admisi",GATE+6,LANE-46);
      ps.forEach(p=>{
        p.x+=p.v; if(p.x>W+10){p.x=-10;p.y=LANE+(Math.random()-.5)*26;p.pass=Math.random()<passRate;p.lane=Math.floor(Math.random()*rej.length);}
        if(p.x>GATE && !p.pass){ const ty=lanes[p.lane]; p.y+=(ty-p.y)*0.06; }
        else if(p.x<=GATE){ p.y+=((LANE)-p.y)*0.03; }
        const rejected=p.x>GATE&&!p.pass;
        ctx.globalAlpha=rejected?.30:(p.x>GATE?.85:.45);
        ctx.fillStyle=rejected?css("--down"):(p.x>GATE?css("--up"):"#7f8a96");
        ctx.beginPath();ctx.arc(p.x,p.y,rejected?1.1:1.7,0,7);ctx.fill();
      });
      ctx.globalAlpha=1;
      if(!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
  return el;
}

const out=document.getElementById("out");
[["A · Hujan peluncuran","Tegak = MC peluncuran (log), mendatar = waktu. Lantai 27,96 ◎ tergambar sendiri karena hampir semua koin lahir di sana; yang menyembul adalah dev yang menaruh modal. Pita entry 55–100 disorot.",rain],
 ["B · Sapuan radar","Sudut = waktu, jari-jari = MC. Pita entry jadi cincin. Garis sapu berputar menyalakan ulang blip yang dilewatinya.",radar],
 ["C · Arus gerbang","Partikel mengalir melewati gerbang admisi; yang ditolak mengelupas ke bawah pada alasannya. Terlihat gerbang mana yang paling menyaring.",gates],
].forEach(([t,n,f])=>{const c=R(t,n);c.appendChild(f());out.appendChild(c)});
